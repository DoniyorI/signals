[project]
name = "signals"
version = "0.1.0"
description = "SEC insider, fund and stake dashboard: ingestion, analytics and API"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.54",
    "sqlalchemy>=2.1",
    "alembic>=1.20",
    "psycopg[binary]>=3.3",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "httpx>=0.28",
    "apscheduler>=3.11,<4",
    "typer>=0.27",
    "structlog>=26.1",
    "lxml>=6.1",
    "pandas>=3.0",
    "numpy>=2.5",
    "exchange-calendars>=4.13",
    "holidays>=0.105",
    "rapidfuzz>=3.14",
    "yfinance>=1.7",
    "tzdata",
]

[project.scripts]
signals = "signals.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "ruff>=0.16",
    "pyright>=1.1.414",
    "pandas-stubs>=3.0",
    "lxml-stubs",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/signals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
typeCheckingMode = "standard"

[tool.ruff.lint.per-file-ignores]
# Autogenerated Alembic migrations keep Alembic's formatting.
"migrations/versions/*" = ["E501"]

[tool.ruff.format]
exclude = ["migrations/versions/*"]
