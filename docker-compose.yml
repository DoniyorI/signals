services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: signals
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: signals
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signals"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build: ./backend
    command: ["signals", "migrate"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://signals:${POSTGRES_PASSWORD}@db:5432/signals
    depends_on:
      db:
        condition: service_healthy

  api:
    build: ./backend
    command: ["signals", "api", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://signals:${POSTGRES_PASSWORD}@db:5432/signals
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build: ./backend
    command: ["signals", "worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://signals:${POSTGRES_PASSWORD}@db:5432/signals
      RAW_ARCHIVE_DIR: /app/data/raw
    volumes:
      - ./data:/app/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      VITE_API_PROXY: http://api:8000
      VITE_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - api

volumes:
  pgdata:
