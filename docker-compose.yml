services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: signals
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: signals
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signals"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
